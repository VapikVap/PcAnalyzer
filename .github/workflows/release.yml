# Выпуск новой версии: поднимите <Version> в Directory.Build.props, закоммитьте и отправьте тег:
#   git tag v0.2.0
#   git push origin v0.2.0
# Workflow соберёт установщик и опубликует его в GitHub Releases — приложения у пользователей увидят обновление.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Тег ${{ github.ref_name }} не совпадает с версией $version в Directory.Build.props"
          }

      - name: Test
        run: dotnet test -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem artifacts -Filter 'PcAnalyzer-Setup-*.exe' | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $setup.FullName --title "PC Performance Analyzer ${{ github.ref_name }}" --generate-notes
